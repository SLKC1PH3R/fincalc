<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patrimo · Concept D Gold</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Geist:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #070910;
      font-family: 'Geist', 'Inter', sans-serif;
      color: #fff;
      padding: 60px 48px;
    }
    h1 {
      font-size: 11px;
      font-weight: 500;
      color: #444;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 64px;
    }
    .section { margin-bottom: 72px; }
    .section-label {
      font-size: 10px;
      color: #333;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 36px;
    }
    .row {
      display: flex;
      gap: 32px;
      align-items: center;
      flex-wrap: wrap;
    }
    .card {
      background: #0c0d14;
      border: 1px solid #181922;
      border-radius: 18px;
      padding: 36px 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .card.light { background: #f5f4f0; }
    .card.dark  { background: #04050a; }
    .label {
      font-size: 9px;
      color: #333;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .label.on-light { color: #999; }
    .divider {
      width: 100%;
      height: 1px;
      background: #10111a;
      margin: 56px 0;
    }
  </style>
</head>
<body>

<h1>Patrimo · Concept D — Gold dot wordmark</h1>

<!-- =====================================================
     SECTION 1 — Variantes tailles
     ===================================================== -->
<div class="section">
  <div class="section-label">Patrimo / finance · fond sombre</div>
  <div class="row">

    <!-- Grand — 34px -->
    <div class="card">
      <svg width="222" height="48" viewBox="0 0 222 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gP-lg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f1c086"/>
            <stop offset="100%" stop-color="#c8922a"/>
          </linearGradient>
        </defs>
        <!-- Dot gold au-dessus du P -->
        <circle cx="9" cy="7" r="4.5" fill="url(#gP-lg)"/>
        <!-- P en gold -->
        <text x="0" y="42" font-family="Geist, Inter, sans-serif" font-weight="800" font-size="34" fill="url(#gP-lg)" letter-spacing="-1">P</text>
        <!-- atrimo en blanc -->
        <text x="24" y="42" font-family="Geist, Inter, sans-serif" font-weight="800" font-size="34" fill="#ffffff" letter-spacing="-1">atrimo</text>
        <!-- slash -->
        <line x1="138" y1="10" x2="149" y2="42" stroke="rgba(200,146,42,0.35)" stroke-width="1.5" stroke-linecap="round"/>
        <!-- finance label -->
        <text x="155" y="38" font-family="Geist, Inter, sans-serif" font-weight="400" font-size="13" fill="rgba(241,192,134,0.45)" letter-spacing="0.04em">finance</text>
      </svg>
      <div class="label">Large · 34px</div>
    </div>

    <!-- Standard — 25px -->
    <div class="card">
      <svg width="172" height="36" viewBox="0 0 172 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gP-md" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f1c086"/>
            <stop offset="100%" stop-color="#c8922a"/>
          </linearGradient>
        </defs>
        <circle cx="7" cy="5" r="3.5" fill="url(#gP-md)"/>
        <text x="0" y="31" font-family="Geist, Inter, sans-serif" font-weight="800" font-size="25" fill="url(#gP-md)" letter-spacing="-0.8">P</text>
        <text x="18" y="31" font-family="Geist, Inter, sans-serif" font-weight="800" font-size="25" fill="#ffffff" letter-spacing="-0.8">atrimo</text>
        <line x1="100" y1="7" x2="109" y2="31" stroke="rgba(200,146,42,0.35)" stroke-width="1.5" stroke-linecap="round"/>
        <text x="114" y="27" font-family="Geist, Inter, sans-serif" font-weight="400" font-size="11" fill="rgba(241,192,134,0.45)" letter-spacing="0.04em">finance</text>
      </svg>
      <div class="label">Standard · 25px</div>
    </div>

    <!-- Navbar — 18px -->
    <div class="card">
      <svg width="132" height="26" viewBox="0 0 132 26" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gP-sm" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f1c086"/>
            <stop offset="100%" stop-color="#c8922a"/>
          </linearGradient>
        </defs>
        <circle cx="5.5" cy="4" r="2.8" fill="url(#gP-sm)"/>
        <text x="0" y="22" font-family="Geist, Inter, sans-serif" font-weight="800" font-size="18" fill="url(#gP-sm)" letter-spacing="-0.6">P</text>
        <text x="13" y="22" font-family="Geist, Inter, sans-serif" font-weight="800" font-size="18" fill="#ffffff" letter-spacing="-0.6">atrimo</text>
        <line x1="73" y1="5" x2="80" y2="22" stroke="rgba(200,146,42,0.35)" stroke-width="1.2" stroke-linecap="round"/>
        <text x="84" y="19" font-family="Geist, Inter, sans-serif" font-weight="400" font-size="9" fill="rgba(241,192,134,0.45)" letter-spacing="0.04em">finance</text>
      </svg>
      <div class="label">Navbar · 18px</div>
    </div>

  </div>
</div>

<div class="divider"></div>

<!-- =====================================================
     SECTION 2 — Fond clair
     ===================================================== -->
<div class="section">
  <div class="section-label">Fond clair</div>
  <div class="row">

    <div class="card light">
      <svg width="172" height="36" viewBox="0 0 172 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gP-lgt" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#c8922a"/>
            <stop offset="100%" stop-color="#a07020"/>
          </linearGradient>
        </defs>
        <circle cx="7" cy="5" r="3.5" fill="url(#gP-lgt)"/>
        <text x="0" y="31" font-family="Geist, Inter, sans-serif" font-weight="800" font-size="25" fill="url(#gP-lgt)" letter-spacing="-0.8">P</text>
        <text x="18" y="31" font-family="Geist, Inter, sans-serif" font-weight="800" font-size="25" fill="#111111" letter-spacing="-0.8">atrimo</text>
        <line x1="100" y1="7" x2="109" y2="31" stroke="rgba(160,112,32,0.3)" stroke-width="1.5" stroke-linecap="round"/>
        <text x="114" y="27" font-family="Geist, Inter, sans-serif" font-weight="400" font-size="11" fill="rgba(160,112,32,0.55)" letter-spacing="0.04em">finance</text>
      </svg>
      <div class="label on-light">Light BG · 25px</div>
    </div>

    <div class="card light">
      <svg width="132" height="26" viewBox="0 0 132 26" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gP-lgt2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#c8922a"/>
            <stop offset="100%" stop-color="#a07020"/>
          </linearGradient>
        </defs>
        <circle cx="5.5" cy="4" r="2.8" fill="url(#gP-lgt2)"/>
        <text x="0" y="22" font-family="Geist, Inter, sans-serif" font-weight="800" font-size="18" fill="url(#gP-lgt2)" letter-spacing="-0.6">P</text>
        <text x="13" y="22" font-family="Geist, Inter, sans-serif" font-weight="800" font-size="18" fill="#111111" letter-spacing="-0.6">atrimo</text>
        <line x1="73" y1="5" x2="80" y2="22" stroke="rgba(160,112,32,0.3)" stroke-width="1.2" stroke-linecap="round"/>
        <text x="77" y="19" font-family="Geist, Inter, sans-serif" font-weight="400" font-size="9" fill="rgba(160,112,32,0.55)" letter-spacing="0.04em">finance</text>
      </svg>
      <div class="label on-light">Light BG · 18px</div>
    </div>

  </div>
</div>

<div class="divider"></div>

<!-- =====================================================
     SECTION 3 — P mark seul (favicon / icône)
     ===================================================== -->
<div class="section">
  <div class="section-label">P mark seul · favicon</div>
  <div class="row" style="align-items: flex-end;">

    <div class="card dark">
      <svg width="52" height="60" viewBox="0 0 52 60" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gFav-lg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f1c086"/>
            <stop offset="100%" stop-color="#c8922a"/>
          </linearGradient>
        </defs>
        <circle cx="13" cy="8" r="6" fill="url(#gFav-lg)"/>
        <text x="0" y="56" font-family="Geist, Inter, sans-serif" font-weight="900" font-size="52" fill="url(#gFav-lg)" letter-spacing="-3">P</text>
      </svg>
      <div class="label">52px</div>
    </div>

    <div class="card dark">
      <svg width="34" height="40" viewBox="0 0 34 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gFav-md" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f1c086"/>
            <stop offset="100%" stop-color="#c8922a"/>
          </linearGradient>
        </defs>
        <circle cx="9" cy="5" r="4" fill="url(#gFav-md)"/>
        <text x="0" y="38" font-family="Geist, Inter, sans-serif" font-weight="900" font-size="36" fill="url(#gFav-md)" letter-spacing="-2">P</text>
      </svg>
      <div class="label">36px</div>
    </div>

    <div class="card dark">
      <svg width="22" height="26" viewBox="0 0 22 26" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gFav-sm" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f1c086"/>
            <stop offset="100%" stop-color="#c8922a"/>
          </linearGradient>
        </defs>
        <circle cx="5.5" cy="3.5" r="2.5" fill="url(#gFav-sm)"/>
        <text x="0" y="24" font-family="Geist, Inter, sans-serif" font-weight="900" font-size="22" fill="url(#gFav-sm)" letter-spacing="-1">P</text>
      </svg>
      <div class="label">22px</div>
    </div>

  </div>
</div>

</body>
</html>
