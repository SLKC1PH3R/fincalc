<line x1="372" y1="256" x2="636" y2="256" stroke="#C8BCAA" stroke-width="0.5"/>

<text x="372" y="274" fill="#6B5E4E" class="mono">TOTAL IMPÔT</text>
<text x="636" y="274" fill="#B84030" class="srf" font-size="22" text-anchor="end">4 720 €</text>

<rect x="372" y="290" width="264" height="12" rx="2" fill="#DDD4C4"/>
