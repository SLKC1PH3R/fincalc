<line x1="32" y1="388" x2="648" y2="388" stroke="#1a1d28" stroke-width="1"/>
<text x="32" y="404" fill="#8a8276" class="mono">MIT LICENSE · CODE SOURCE OUVERT</text>
<text x="648" y="404" fill="#8a8276" class="mono" text-anchor="end">MADE IN FRANCE</text>

