<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Planche Patrimo — Simulation fiscale Flat Tax vs Barème</title>
<desc>Comparateur fiscal : Flat Tax 30 % (optimal, 3 000 €) vs Barème TMI 30 % (4 720 €). Économie de 1 720 € sur une plus-value de 10 000 €.</desc>
<defs>
<style>
.mono{font-family:ui-monospace,SFMono-Regular,monospace;font-size:10px;letter-spacing:0.1em}
.srf{font-family:Georgia,"Tiempos Headline",serif}
.sans{font-family:-apple-system,system-ui,sans-serif}
</style>
</defs>
<rect width="680" height="520" fill="#ece2cf"/>
<!-- Frame top -->
<line x1="32" y1="34" x2="648" y2="34" stroke="#c87a4d" stroke-width="0.5" opacity="0.7"/>
<text x="32" y="24" fill="#a3623a" class="mono" opacity="0.9">PATRIMO · PTM-06 · 2026</text>
<text x="648" y="24" fill="#a3623a" class="mono" text-anchor="end" opacity="0.9">FIG. 06 — PLANCHE 006 / 008</text>
<!-- Section label -->
<text x="32" y="74" fill="#8a7f6c" class="mono">V. — MÉTHODE · ÉTAPE iii · SIMULATION FISCALE</text>
<!-- Context row -->
<text x="32" y="88" fill="#8a7f6c" class="mono">PLUS-VALUE 10 000 € · TMI 30 % · CESSION PEA</text>
<!-- LEFT: Flat Tax (winner, blue-violet border) -->
<rect x="32" y="96" width="296" height="260" fill="#f3ead9" stroke="#6b7fc4" stroke-width="1.5" rx="4"/>
<rect x="32" y="96" width="296" height="4" fill="#6b7fc4" rx="2"/>
<!-- OPTIMAL badge -->
<rect x="264" y="104" width="56" height="16" rx="8" fill="#6b7fc4"/>
<text x="292" y="116" fill="#f0eef7" class="mono" text-anchor="middle" font-size="8.5" font-weight="700">OPTIMAL</text>
<text x="44" y="118" fill="#6b7fc4" class="mono" font-weight="700">FLAT TAX — PRÉLÈVEMENT FORFAITAIRE</text>
<text x="44" y="134" fill="#8a7f6c" class="mono">Taux unique : 30 % (IR + PS)</text>
<line x1="44" y1="142" x2="316" y2="142" stroke="#d4c7b0" stroke-width="0.5"/>
<text x="44" y="158" fill="#564a3a" class="mono">IR (12,8 %)</text>
<text x="316" y="158" fill="#564a3a" class="mono" text-anchor="end">1 280 €</text>
<line x1="44" y1="163" x2="316" y2="163" stroke="#e0d3b9" stroke-width="0.5"/>
<text x="44" y="179" fill="#564a3a" class="mono">Prélèvements sociaux (17,2 %)</text>
<text x="316" y="179" fill="#564a3a" class="mono" text-anchor="end">1 720 €</text>
<line x1="44" y1="184" x2="316" y2="184" stroke="#e0d3b9" stroke-width="0.5"/>
<text x="44" y="200" fill="#564a3a" class="mono">Abattement 40 % (dividendes)</text>
<text x="316" y="200" fill="#5ba87a" class="mono" text-anchor="end">— s/o</text>
<line x1="44" y1="205" x2="316" y2="205" stroke="#e0d3b9" stroke-width="0.5"/>
<text x="44" y="221" fill="#564a3a" class="mono">Déductibilité CSG (6,8 %)</text>
<text x="316" y="221" fill="#5ba87a" class="mono" text-anchor="end">— non</text>
<line x1="44" y1="230" x2="316" y2="230" stroke="#6b7fc4" stroke-width="0.5" opacity="0.5"/>
<text x="44" y="248" fill="#6b7fc4" class="mono" font-weight="700">TOTAL IMPÔT</text>
<text x="316" y="248" fill="#6b7fc4" class="srf" font-size="24" text-anchor="end">3 000 €</text>
<rect x="44" y="264" width="264" height="10" rx="2" fill="#e0d3b9"/>
<rect x="44" y="264" width="168" height="10" rx="2" fill="#6b7fc4" opacity="0.6"/>
<text x="44" y="290" fill="#5ba87a" class="mono">TAUX EFFECTIF : 30,0 %</text>
<text x="44" y="306" fill="#5ba87a" class="mono">NET ENCAISSÉ : 7 000 €</text>
<!-- RIGHT: Barème TMI (loser) -->
<rect x="352" y="96" width="296" height="260" fill="#f3ead9" stroke="#d4c7b0" stroke-width="1" rx="4"/>
<rect x="352" y="96" width="296" height="4" fill="#d4895a" rx="2"/>
