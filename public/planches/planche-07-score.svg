<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 490">
<style>
.mono{font-family:ui-monospace,SFMono-Regular,monospace;font-size:10px;letter-spacing:0.1em}
.srf{font-family:Georgia,serif}
.sans{font-family:-apple-system,system-ui,sans-serif}
</style>
<rect width="680" height="490" fill="#070910"/>
<line x1="32" y1="34" x2="648" y2="34" stroke="#f1c086" stroke-width="0.5" opacity="0.5"/>
<text x="32" y="24" fill="#f1c086" class="mono" opacity="0.75">PATRIMO · PTM-07 · 2026</text>
<text x="648" y="24" fill="#f1c086" class="mono" opacity="0.75" text-anchor="end">FIG. 07 — PLANCHE 007 / 008</text>
<text x="32" y="58" fill="#8a8276" class="mono">VI. — SCORE PATRIMONIAL · 0–100 PTS</text>
<line x1="32" y1="68" x2="648" y2="68" stroke="#1a1d28" stroke-width="1"/>

<!-- Big score -->
<text x="32" y="118" fill="#f1c086" class="srf" font-size="72">72</text>
<text x="128" y="100" fill="#3e3a32" class="srf" font-size="48">/ 100</text>
<text x="32" y="136" fill="#a8a092" class="mono">MARC D. · 38 ANS · PARIS · MAI 2026</text>

<!-- Score level badge -->
<rect x="32" y="148" width="90" height="18" rx="2" fill="#1a1d28"/>
<text x="40" y="161" fill="#f1c086" class="mono">BON NIVEAU</text>

<!-- Score gauge arc (decorative) — simple tick marks -->
<line x1="400" y1="130" x2="648" y2="130" stroke="#1a1d28" stroke-width="1"/>
<text x="404" y="116" fill="#8a8276" class="mono">0</text>
<text x="444" y="116" fill="#8a8276" class="mono">25</text>
<text x="492" y="116" fill="#8a8276" class="mono">50</text>
<text x="540" y="116" fill="#8a8276" class="mono">75</text>
<text x="588" y="116" fill="#8a8276" class="mono">100</text>
<!-- Gauge bar -->
<rect x="404" y="120" width="240" height="6" rx="2" fill="#1a1d28"/>
<rect x="404" y="120" width="173" height="6" rx="2" fill="#f1c086" opacity="0.8"/>
<!-- Marker -->
<line x1="577" y1="117" x2="577" y2="129" stroke="#f1c086" stroke-width="1.5"/>

<line x1="32" y1="178" x2="648" y2="178" stroke="#1a1d28" stroke-width="1"/>

<!-- 7 dimension bars (left column) -->
<text x="32" y="196" fill="#8a8276" class="mono">7 PILIERS · DÉCOMPOSITION DU SCORE</text>

<!-- Pilier 1 - Sécurité 22/25 -->
<text x="32" y="218" fill="#a8a092" class="mono">01  SÉCURITÉ DE BASE</text>
<rect x="220" y="208" width="200" height="7" rx="2" fill="#1a1d28"/>
<rect x="220" y="208" width="176" height="7" rx="2" fill="#f1c086"/>
<text x="428" y="217" fill="#f1c086" class="mono">22 / 25</text>
<text x="530" y="217" fill="#7a9b6e" class="mono">6,2 MOIS ÉPARGNE</text>

<!-- Pilier 2 - Immobilier 14/20 -->
<text x="32" y="237" fill="#a8a092" class="mono">02  IMMOBILIER</text>
<rect x="220" y="227" width="200" height="7" rx="2" fill="#1a1d28"/>
<rect x="220" y="227" width="140" height="7" rx="2" fill="#c4a378"/>
<text x="428" y="236" fill="#c4a378" class="mono">14 / 20</text>
<text x="530" y="236" fill="#a8a092" class="mono">LTV 24 %</text>

<!-- Pilier 3 - Long terme 18/25 -->
<text x="32" y="256" fill="#a8a092" class="mono">03  ENVELOPPES LONG TERME</text>
<rect x="220" y="246" width="200" height="7" rx="2" fill="#1a1d28"/>
<rect x="220" y="246" width="144" height="7" rx="2" fill="#c4a378"/>
<text x="428" y="255" fill="#c4a378" class="mono">18 / 25</text>
<text x="530" y="255" fill="#a8a092" class="mono">AV + PEA OK</text>

<!-- Pilier 4 - Diversification 10/20 -->
<text x="32" y="275" fill="#a8a092" class="mono">04  DIVERSIFICATION</text>
<rect x="220" y="265" width="200" height="7" rx="2" fill="#1a1d28"/>
<rect x="220" y="265" width="100" height="7" rx="2" fill="#8a7656"/>
<text x="428" y="274" fill="#8a7656" class="mono">10 / 20</text>
<text x="530" y="274" fill="#c46a5a" class="mono">À AMÉLIORER</text>

<!-- Pilier 5 - Risque 8/10 -->
<text x="32" y="294" fill="#a8a092" class="mono">05  MAÎTRISE DU RISQUE</text>
<rect x="220" y="284" width="200" height="7" rx="2" fill="#1a1d28"/>
<rect x="220" y="284" width="160" height="7" rx="2" fill="#7a9b6e"/>
<text x="428" y="293" fill="#7a9b6e" class="mono">08 / 10</text>
<text x="530" y="293" fill="#7a9b6e" class="mono">CRYPTO 0 %</text>

<!-- Pilier 6 - Retraite 0/? -->
<text x="32" y="313" fill="#3e3a32" class="mono">06  PRÉPARATION RETRAITE</text>
<rect x="220" y="303" width="200" height="7" rx="2" fill="#1a1d28"/>
<text x="428" y="312" fill="#3e3a32" class="mono">— / —</text>
<text x="530" y="312" fill="#3e3a32" class="mono">À VENIR Q3</text>

<!-- Pilier 7 - Fiscalité 0/? -->
<text x="32" y="332" fill="#3e3a32" class="mono">07  OPTIMISATION FISCALE</text>
<rect x="220" y="322" width="200" height="7" rx="2" fill="#1a1d28"/>
<text x="428" y="331" fill="#3e3a32" class="mono">— / —</text>
<text x="530" y="331" fill="#3e3a32" class="mono">À VENIR Q3</text>

<line x1="32" y1="348" x2="648" y2="348" stroke="#1a1d28" stroke-width="1"/>

<!-- 3 Quick actions -->
<text x="32" y="366" fill="#8a8276" class="mono">3 ACTIONS RECOMMANDÉES POUR PROGRESSER</text>

<!-- Action 1 -->
<rect x="32" y="374" width="190" height="56" rx="3" fill="#0c0f1c" stroke="#1a1d28" stroke-width="1"/>
<text x="42" y="390" fill="#c4a378" class="mono">+10 PTS POTENTIELS</text>
<text x="42" y="404" fill="#a8a092" class="sans" font-size="10" font-weight="600">Déclarer une AV</text>
<text x="42" y="418" fill="#6b7280" class="mono">Enveloppe manquante</text>

<!-- Action 2 -->
<rect x="230" y="374" width="190" height="56" rx="3" fill="#0c0f1c" stroke="#1a1d28" stroke-width="1"/>
<text x="240" y="390" fill="#8a7656" class="mono">+5 PTS POTENTIELS</text>
<text x="240" y="404" fill="#a8a092" class="sans" font-size="10" font-weight="600">Diversifier les enveloppes</text>
<text x="240" y="418" fill="#6b7280" class="mono">CTO, PER à explorer</text>

<!-- Action 3 -->
<rect x="428" y="374" width="220" height="56" rx="3" fill="#0c0f1c" stroke="#1a1d28" stroke-width="1"/>
<text x="438" y="390" fill="#8a7656" class="mono">+3 PTS POTENTIELS</text>
<text x="438" y="404" fill="#a8a092" class="sans" font-size="10" font-weight="600">Alimenter l'épargne</text>
<text x="438" y="418" fill="#6b7280" class="mono">Objectif 6 mois dépenses</text>

<!-- Score potential -->
<text x="32" y="448" fill="#8a8276" class="mono">SCORE POTENTIEL APRÈS ACTIONS</text>
<text x="648" y="448" fill="#f1c086" class="mono" text-anchor="end">72 → 90 / 100</text>

<!-- Bottom frame -->
<line x1="32" y1="468" x2="648" y2="468" stroke="#f1c086" stroke-width="0.5" opacity="0.5"/>
<text x="32" y="482" fill="#f1c086" class="mono" opacity="0.75">PATRIMO · 2026</text>
<text x="648" y="482" fill="#f1c086" class="mono" opacity="0.75" text-anchor="end">007 / FIN</text>
</svg>
