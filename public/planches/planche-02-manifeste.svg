<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Planche Patrimo — Manifeste</title>
<desc>Manifeste Patrimo : couche d'intelligence patrimoniale. 24 simulateurs, 15 enveloppes, 5 piliers, 0 donnée bancaire.</desc>
<defs>
<style>
.mono{font-family:ui-monospace,SFMono-Regular,monospace;font-size:10px;letter-spacing:0.1em}
.srf{font-family:Georgia,"Tiempos Headline",serif}
.sans{font-family:-apple-system,system-ui,sans-serif}
</style>
</defs>
<rect width="680" height="520" fill="#ece2cf"/>
<!-- Frame top -->
<line x1="32" y1="34" x2="648" y2="34" stroke="#c87a4d" stroke-width="0.5" opacity="0.7"/>
<text x="32" y="24" fill="#a3623a" class="mono" opacity="0.9">PATRIMO · PTM-02 · 2026</text>
<text x="648" y="24" fill="#a3623a" class="mono" text-anchor="end" opacity="0.9">FIG. 02 — PLANCHE 002 / 008</text>
<!-- Section label -->
<text x="32" y="74" fill="#8a7f6c" class="mono">II. — MANIFESTE · IDENTITÉ</text>
<!-- Quote card -->
<rect x="32" y="92" width="616" height="208" fill="#f3ead9" stroke="#d4c7b0" stroke-width="0.5" rx="4"/>
<rect x="48" y="112" width="2" height="168" fill="#c87a4d" opacity="0.35" rx="1"/>
<text x="340" y="138" fill="#1a1612" class="srf" font-style="italic" font-size="22" text-anchor="middle">« Patrimo n'est pas un outil de plus.</text>
<text x="340" y="166" fill="#1a1612" class="srf" font-style="italic" font-size="22" text-anchor="middle">C'est une couche d'intelligence</text>
<text x="340" y="194" fill="#1a1612" class="srf" font-style="italic" font-size="22" text-anchor="middle">qui transforme la complexité</text>
<text x="340" y="222" fill="#1a1612" class="srf" font-style="italic" font-size="22" text-anchor="middle">patrimoniale en décisions claires. »</text>
<text x="636" y="280" fill="#8a7f6c" class="srf" font-style="italic" font-size="11" text-anchor="end">Manifeste · 2024</text>
<!-- Separator -->
<line x1="32" y1="312" x2="648" y2="312" stroke="#d4c7b0" stroke-width="0.5"/>
<!-- 4 number cards (each w=148, gap=8) -->
<rect x="32" y="320" width="148" height="100" fill="#f3ead9" stroke="#d4c7b0" stroke-width="0.5" rx="4"/>
<text x="106" y="378" fill="#c87a4d" class="srf" font-size="44" text-anchor="middle">24</text>
<text x="106" y="400" fill="#8a7f6c" class="mono" font-size="8.5" text-anchor="middle">SIMULATEURS</text>
<rect x="188" y="320" width="148" height="100" fill="#f3ead9" stroke="#d4c7b0" stroke-width="0.5" rx="4"/>
<text x="262" y="378" fill="#c87a4d" class="srf" font-size="44" text-anchor="middle">15</text>
<text x="262" y="400" fill="#8a7f6c" class="mono" font-size="8.5" text-anchor="middle">ENVELOPPES</text>
<rect x="344" y="320" width="148" height="100" fill="#f3ead9" stroke="#d4c7b0" stroke-width="0.5" rx="4"/>
<text x="418" y="378" fill="#c87a4d" class="srf" font-size="44" text-anchor="middle">5</text>
<text x="418" y="400" fill="#8a7f6c" class="mono" font-size="8.5" text-anchor="middle">PILIERS DU SCORE</text>
<rect x="500" y="320" width="148" height="100" fill="#f3ead9" stroke="#d4c7b0" stroke-width="0.5" rx="4"/>
<text x="574" y="378" fill="#c87a4d" class="srf" font-size="44" text-anchor="middle">0</text>
<text x="574" y="400" fill="#8a7f6c" class="mono" font-size="8.5" text-anchor="middle">DONNÉE BANCAIRE</text>
<!-- Frame bottom -->
<line x1="32" y1="494" x2="648" y2="494" stroke="#c87a4d" stroke-width="0.5" opacity="0.7"/>
<text x="32" y="508" fill="#a3623a" class="mono" opacity="0.9">FONDÉ EN 2024 · OPEN-SOURCE</text>
<text x="648" y="508" fill="#a3623a" class="mono" text-anchor="end" opacity="0.9">MADE IN FRANCE</text>
</svg>
