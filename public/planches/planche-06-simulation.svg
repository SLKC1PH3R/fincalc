<line x1="32" y1="494" x2="648" y2="494" stroke="#c87a4d" stroke-width="0.5" opacity="0.7"/>
<text x="32" y="508" fill="#a3623a" class="mono" opacity="0.9">MÉTHODE PATRIMO · ÉTAPE iii</text>
<text x="648" y="508" fill="#a3623a" class="mono" text-anchor="end" opacity="0.9">SIMULATEURS FISCAUX · MAI 2026</text>
