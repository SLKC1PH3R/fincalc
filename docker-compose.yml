version: '3.8'

services:
  # ─── Application Next.js ────────────────────────────────────────────────────
  app:
    build: .
    container_name: fincalc-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://fincalc:${POSTGRES_PASSWORD}@postgres:5432/fincalc
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fincalc-net

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fincalc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fincalc
      POSTGRES_USER: fincalc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincalc -d fincalc"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fincalc-net

  # ─── Migration job (runs once then exits) ────────────────────────────────────
  migrate:
    build: .
    container_name: fincalc-migrate
    command: sh -c "npx prisma db push --accept-data-loss && npx prisma db seed"
    environment:
      DATABASE_URL: postgresql://fincalc:${POSTGRES_PASSWORD}@postgres:5432/fincalc
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fincalc-net
    restart: "no"

  # ─── Snapshot journalier à minuit ────────────────────────────────────────────
  cron:
    image: alpine:3.19
    container_name: fincalc-cron
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - fincalc-net
    environment:
      CRON_SECRET: ${CRON_SECRET}
    command: >-
      sh -c "
        apk add --no-cache curl &&
        printf '#!/bin/sh\ncurl -fsS -X POST -H \"Authorization: Bearer %s\" http://app:3000/api/cron/snapshot\n' \"$$CRON_SECRET\" > /snap.sh &&
        chmod +x /snap.sh &&
        echo '0 0 * * * /snap.sh' | crontab - &&
        crond -f -l 8
      "

volumes:
  postgres_data:

networks:
  fincalc-net:
    driver: bridge
