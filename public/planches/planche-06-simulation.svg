<text x="636" y="158" fill="#8a3a3a" class="mono" text-anchor="end">3 000 €</text>
<line x1="364" y1="163" x2="636" y2="163" stroke="#e0d3b9" stroke-width="0.5"/>
<text x="364" y="179" fill="#564a3a" class="mono">Prélèvements sociaux (17,2 %)</text>
<text x="636" y="179" fill="#564a3a" class="mono" text-anchor="end">1 720 €</text>
<line x1="364" y1="184" x2="636" y2="184" stroke="#e0d3b9" stroke-width="0.5"/>
<text x="364" y="200" fill="#564a3a" class="mono">Abattement 40 % (dividendes)</text>
<text x="636" y="200" fill="#5ba87a" class="mono" text-anchor="end">applicable</text>
<line x1="364" y1="205" x2="636" y2="205" stroke="#e0d3b9" stroke-width="0.5"/>
<text x="364" y="221" fill="#564a3a" class="mono">Déductibilité CSG (6,8 %)</text>
<text x="636" y="221" fill="#5ba87a" class="mono" text-anchor="end">possible</text>
<line x1="364" y1="230" x2="636" y2="230" stroke="#d4c7b0" stroke-width="0.5"/>
<text x="364" y="248" fill="#564a3a" class="mono">TOTAL IMPÔT</text>
<text x="636" y="248" fill="#8a3a3a" class="srf" font-size="24" text-anchor="end">4 720 €</text>
<rect x="364" y="264" width="264" height="10" rx="2" fill="#e0d3b9"/>
<rect x="364" y="264" width="264" height="10" rx="2" fill="#d4895a" opacity="0.3"/>
<text x="364" y="290" fill="#8a3a3a" class="mono">TAUX EFFECTIF : 47,2 %</text>
<text x="364" y="306" fill="#8a3a3a" class="mono">NET ENCAISSÉ : 5 280 €</text>
<!-- Savings banner -->
<rect x="32" y="372" width="616" height="60" fill="#f3ead9" stroke="#c87a4d" stroke-width="0.8" rx="4"/>
<text x="340" y="396" fill="#8a7f6c" class="mono" text-anchor="middle">ÉCONOMIE RÉALISÉE EN OPTANT POUR LA FLAT TAX</text>
<text x="340" y="422" fill="#c87a4d" class="srf" font-size="30" text-anchor="middle">1 720 €</text>
<!-- Footer info -->
<text x="32" y="452" fill="#8a7f6c" class="mono">1 SIMULATION / 24 DISPONIBLES</text>
<text x="648" y="452" fill="#8a7f6c" class="mono" text-anchor="end">TMI 30 % · PLUS-VALUE 10 000 €</text>
