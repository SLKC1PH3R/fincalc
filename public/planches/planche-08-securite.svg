<svg width="100%" viewBox="0 0 680 500" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Planche Patrimo — Sécurité &amp; Confiance</title>
<desc>Architecture de confiance Patrimo : zéro donnée bancaire, chiffrement AES-256, RGPD, hébergement UE, code open-source.</desc>
<defs>
<style>
.mono{font-family:ui-monospace,SFMono-Regular,monospace;font-size:10px;letter-spacing:0.1em}
.srf{font-family:Georgia,"Tiempos Headline",serif}
.sans{font-family:-apple-system,system-ui,sans-serif}
</style>
</defs>
<rect width="680" height="500" fill="#ece2cf"/>
<!-- Frame top -->
<line x1="32" y1="34" x2="648" y2="34" stroke="#c87a4d" stroke-width="0.5" opacity="0.7"/>
<text x="32" y="24" fill="#a3623a" class="mono" opacity="0.9">PATRIMO · PTM-08 · 2026</text>
<text x="648" y="24" fill="#a3623a" class="mono" text-anchor="end" opacity="0.9">FIG. 08 — PLANCHE 008 / 008</text>
<!-- Section label -->
<text x="32" y="74" fill="#8a7f6c" class="mono">VII. — SÉCURITÉ · CONFIANCE</text>
<!-- MAIN SCHEMA CARD -->
<rect x="32" y="92" width="616" height="180" fill="#f3ead9" stroke="#d4c7b0" stroke-width="0.5" rx="4"/>
<!-- LEFT: API Bancaires (blocked) -->
<rect x="56" y="116" width="130" height="80" fill="#ece2cf" stroke="#d4c7b0" stroke-width="1" rx="3"/>
<text x="121" y="140" fill="#8a7f6c" class="mono" text-anchor="middle">API BANCAIRES</text>
<!-- Big X mark (blocked) -->
<line x1="72" y1="152" x2="170" y2="188" stroke="#c87a4d" stroke-width="2.5"/>
<line x1="170" y1="152" x2="72" y2="188" stroke="#c87a4d" stroke-width="2.5"/>
<text x="121" y="212" fill="#c87a4d" class="mono" text-anchor="middle">BLOQUÉ</text>
<!-- Arrow (crossed) from left to center -->
<line x1="196" y1="160" x2="240" y2="160" stroke="#d4c7b0" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="226" y1="152" x2="240" y2="160" stroke="#d4c7b0" stroke-width="1.5"/>
<line x1="226" y1="168" x2="240" y2="160" stroke="#d4c7b0" stroke-width="1.5"/>
<line x1="208" y1="152" x2="216" y2="168" stroke="#c87a4d" stroke-width="2"/>
<line x1="216" y1="152" x2="208" y2="168" stroke="#c87a4d" stroke-width="2"/>
<!-- CENTER: Vos données Patrimo -->
<rect x="248" y="108" width="156" height="148" fill="#f3ead9" stroke="#c87a4d" stroke-width="1.5" rx="4"/>
<!-- Padlock icon (simple SVG) -->
<rect x="304" y="140" width="40" height="30" fill="none" stroke="#c87a4d" stroke-width="2" rx="3"/>
<path d="M 308 140 Q 308 124 324 124 Q 340 124 340 140" fill="none" stroke="#c87a4d" stroke-width="2"/>
<circle cx="324" cy="158" r="5" fill="#c87a4d" opacity="0.6"/>
<text x="326" y="196" fill="#1a1612" class="srf" font-size="11" text-anchor="middle">Vos données,</text>
<text x="326" y="210" fill="#1a1612" class="srf" font-style="italic" font-size="11" text-anchor="middle">à vous</text>
<text x="326" y="226" fill="#8a7f6c" class="mono" text-anchor="middle">AES-256 · UE</text>
<!-- Arrow right from center -->
<line x1="414" y1="182" x2="456" y2="182" stroke="#d4c7b0" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="442" y1="174" x2="456" y2="182" stroke="#d4c7b0" stroke-width="1.5"/>
<line x1="442" y1="190" x2="456" y2="182" stroke="#d4c7b0" stroke-width="1.5"/>
<!-- RIGHT: Manual input label -->
<rect x="464" y="128" width="150" height="60" fill="#ece2cf" stroke="#d4c7b0" stroke-width="1" rx="3"/>
<text x="539" y="152" fill="#8a7f6c" class="mono" text-anchor="middle">SAISIE MANUELLE</text>
<text x="539" y="168" fill="#5ba87a" class="mono" text-anchor="middle">VOUS CONTRÔLEZ</text>
<!-- GUARANTEES CARD -->
<rect x="32" y="290" width="616" height="152" fill="#f3ead9" stroke="#d4c7b0" stroke-width="0.5" rx="4"/>
<circle cx="56" cy="316" r="3" fill="#c87a4d"/>
<text x="68" y="320" fill="#8a7f6c" class="mono">5 GARANTIES</text>
<!-- 5 guarantee items in 2 columns -->
<text x="56" y="344" fill="#5ba87a" class="sans" font-size="13">✓</text>
<text x="74" y="344" fill="#1a1612" class="sans" font-size="11">Chiffrement AES-256</text>
<text x="56" y="366" fill="#5ba87a" class="sans" font-size="13">✓</text>
<text x="74" y="366" fill="#1a1612" class="sans" font-size="11">Conforme RGPD</text>
<text x="56" y="388" fill="#5ba87a" class="sans" font-size="13">✓</text>
<text x="74" y="388" fill="#1a1612" class="sans" font-size="11">Hébergement en UE</text>
<text x="356" y="344" fill="#5ba87a" class="sans" font-size="13">✓</text>
<text x="374" y="344" fill="#1a1612" class="sans" font-size="11">Code open-source</text>
<text x="356" y="366" fill="#5ba87a" class="sans" font-size="13">✓</text>
<text x="374" y="366" fill="#1a1612" class="sans" font-size="11">Zéro donnée bancaire</text>
<!-- Bottom emphasis -->
<text x="340" y="424" fill="#c87a4d" class="srf" font-size="14" text-anchor="middle" font-style="italic">« Vous saisissez. Nous ne collectons rien. »</text>
<!-- Frame bottom -->
<line x1="32" y1="474" x2="648" y2="474" stroke="#c87a4d" stroke-width="0.5" opacity="0.7"/>
<text x="32" y="488" fill="#a3623a" class="mono" opacity="0.9">ARCHITECTURE DE CONFIANCE · ZÉRO COMPROMIS</text>
<text x="648" y="488" fill="#a3623a" class="mono" text-anchor="end" opacity="0.9">OPEN-SOURCE · MADE IN FRANCE</text>
</svg>
