<!-- Savings banner -->
<rect x="32" y="368" width="616" height="52" rx="4" fill="#EDE8DF" stroke="#B07820" stroke-width="0.8" opacity="0.9"/>
<text x="340" y="390" fill="#7A7468" class="mono" text-anchor="middle">ÉCONOMIE RÉALISÉE EN OPTANT POUR LA FLAT TAX</text>
<text x="340" y="412" fill="#B07820" class="srf" font-size="28" text-anchor="middle">1 720 €</text>

<!-- Footer info -->
<text x="32" y="444" fill="#7A7468" class="mono">1 SIMULATION / 18 DISPONIBLES</text>
<text x="648" y="444" fill="#7A7468" class="mono" text-anchor="end">MARC D. · TMI 30 % · PLUS-VALUE 10 000 €</text>
