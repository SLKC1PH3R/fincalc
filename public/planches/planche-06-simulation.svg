<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 68 680 404">
<style>
.mono{font-family:ui-monospace,SFMono-Regular,monospace;font-size:10px;letter-spacing:0.1em}
.srf{font-family:Georgia,serif}
.sans{font-family:-apple-system,system-ui,sans-serif}
</style>
<rect width="680" height="500" fill="#F5F0E8"/>

<!-- Simulation context -->
<text x="32" y="88" fill="#6B5E4E" class="mono">PLUS-VALUE RÉALISÉE : 10 000 € · TMI 30 % · MARC D. · CESSION PEA</text>

